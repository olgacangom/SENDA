services:
  db:
    image: postgres:15-alpine
    container_name: senda_postgres
    environment:
      POSTGRES_DB: senda_db
      POSTGRES_USER: senda_user
      POSTGRES_PASSWORD: senda_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: senda_redis

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: senda_web
    command: python manage.py runserver 0.0.0.0:1574
    volumes:
      - ./backend:/app
    ports:
      - "1574:1574"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://senda_user:senda_password@db:5432/senda_db
      - REDIS_URL=redis://redis:6379/0

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: senda_celery_worker
    command: celery -A config worker --loglevel=info --pool=solo
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://senda_user:senda_password@db:5432/senda_db
      - REDIS_URL=redis://redis:6379/0

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: senda_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://senda_user:senda_password@db:5432/senda_db
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build: ./frontend
    container_name: senda_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data: