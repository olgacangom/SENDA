services:
  redis:
    image: redis:alpine
    container_name: senda_redis
    restart: unless-stopped
    network_mode: "host"

  web:
    image: senda-web
    container_name: senda_web
    command: python manage.py runserver 0.0.0.0:1574
    volumes:
      - ./backend:/app
    network_mode: "host"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://localhost:6379/0
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,192.168.20.84,senda.sendaproject.es,172.17.0.1,.int.local

  celery_worker:
    image: senda-celery_worker
    container_name: senda_celery_worker
    command: celery -A config worker --loglevel=info --pool=solo
    volumes:
      - ./backend:/app
    network_mode: "host"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://localhost:6379/0
      - DEBUG=False      
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,192.168.20.84,senda.sendaproject.es,172.17.0.1,.int.local

  celery_beat:
    image: senda-celery_beat
    container_name: senda_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    network_mode: "host"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://localhost:6379/0
      - DEBUG=False      
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - HTTP_PROXY=http://proxy.int.local:3128
      - HTTPS_PROXY=http://proxy.int.local:3128
      - NO_PROXY=127.0.0.1,localhost,192.168.20.84,senda.sendaproject.es,172.17.0.1,.int.local

  frontend:
    image: senda-frontend
    container_name: senda_frontend
    command: npm run dev -- --host 0.0.0.0 --port 5174
    volumes:
      - ./frontend:/app
      - /app/node_modules
    network_mode: "host"
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true


